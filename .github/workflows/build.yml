name: build bleeARM

on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: create a GitHub release
        required: true
        default: 'false'
        type: boolean
      version:
        description: release version
        required: false
        default: '0.4.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cpio xz-utils gzip libarchive-tools qemu-utils qemu-system-arm \
            xorriso gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev make curl

      - name: build
        run: chmod +x build.sh && ./build.sh

      - name: test QEMU boot
        run: |
          set +e
          timeout 30s qemu-system-aarch64 \
            -M virt \
            -cpu cortex-a53 \
            -m 1G \
            -kernel out/Image \
            -initrd out/initramfs.cpio.gz \
            -append "console=ttyAMA0 rdinit=/init" \
            -nographic > qemu.log 2>&1
          status=$?
          cat qemu.log
          grep -q "bleeARM 0.4-dev" qemu.log
          grep -q "base: Arch Linux ARM" qemu.log
          grep -q "Arch Linux ARM userspace is ready." qemu.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

      - name: build test ISO
        run: |
          mkdir -p iso-root/bleeARM
          cp out/Image iso-root/bleeARM/
          cp out/initramfs.cpio.gz iso-root/bleeARM/
          cp README.md iso-root/
          xorriso -as mkisofs -V BLEEARM_TEST -o out/bleeARM-qemu-test.iso iso-root

      - name: package partition examples
        run: |
          mkdir -p partitions/boot
          cp out/Image partitions/boot/
          printf '%s\n' \
            'bleeARM boot partition example.' \
            'The included Image is for QEMU aarch64 virt testing.' \
            'The Lenovo TB-8505F will require its own kernel, device tree and boot format.' \
            > partitions/boot/README.txt
          tar -C partitions -czf out/bleeARM-boot-example.tar.gz boot

          # Do not duplicate the complete Arch rootfs into another directory.
          # Archive it directly from out/rootfs.
          tar -C out -czf out/bleeARM-system-rootfs.tar.gz rootfs

      - name: checksums
        run: |
          mkdir -p release
          cp out/bleeARM-qemu-test.iso release/
          cp out/bleeARM-boot-example.tar.gz release/
          cp out/bleeARM-system-rootfs.tar.gz release/
          cp out/initramfs.cpio.gz release/
          cp out/Image release/bleeARM-qemu-Image
          sha256sum release/* > release/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: bleeARM-${{ github.sha }}
          path: release/
          retention-days: 30

      - name: create GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: bleeARM v${{ inputs.version }}
          generate_release_notes: true
          files: |
            release/bleeARM-qemu-test.iso
            release/bleeARM-boot-example.tar.gz
            release/bleeARM-system-rootfs.tar.gz
            release/initramfs.cpio.gz
            release/bleeARM-qemu-Image
            release/SHA256SUMS
